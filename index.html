<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas de Multiplicar Mágicas</title>
    <!-- Fuente redondeada y amigable para niños (Fredoka) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Fondo principal */
            --bg-color: #f8fafc;
            --text-main: #334155;

            /* Paleta de colores pasteles vibrantes */
            --pastel-1: #ffb3ba;
            /* Rosa */
            --pastel-2: #ffdfba;
            /* Naranja */
            --pastel-3: #ffffba;
            /* Amarillo */
            --pastel-4: #baffc9;
            /* Verde claro */
            --pastel-5: #bae1ff;
            /* Azul celeste */
            --pastel-6: #e0baff;
            /* Lila */
            --pastel-7: #ffb3ff;
            /* Rosa brillante */
            --pastel-8: #a8e6cf;
            /* Menta */
            --pastel-9: #ffdfd3;
            /* Durazno */
            --pastel-10: #d4a5a5;
            /* Rosa antiguo pastel */
        }

        * {
            box-sizing: border-box;
            user-select: none;
            /* Evitar selección al hacer muchos clics rápidos */
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            /* Patrón de puntitos divertidos de fondo */
            background-image: radial-gradient(#cbd5e1 3px, transparent 3px);
            background-size: 32px 32px;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            animation: bounceIn 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        h1 {
            font-size: 4.5rem;
            margin: 0;
            color: #ec4899;
            text-shadow: 4px 4px 0px #fbcfe8, 8px 8px 0px rgba(0, 0, 0, 0.05);
            letter-spacing: 2px;
            font-weight: 700;
        }

        p {
            font-size: 1.6rem;
            color: #64748b;
            font-weight: 500;
            margin-top: 10px;
        }

        .controls {
            text-align: center;
            margin-top: 1.5rem;
            margin-bottom: 3rem;
        }

        .btn-reset {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.3rem;
            font-weight: 600;
            font-family: 'Fredoka', sans-serif;
            border-radius: 99px;
            cursor: pointer;
            box-shadow: 0 6px 0 #2563eb, 0 10px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.1s;
        }

        .btn-reset:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #2563eb, 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .btn-reset:hover {
            filter: brightness(1.1);
        }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
            max-width: 1400px;
            margin: 0 auto;
            padding-bottom: 3rem;
        }

        .table-card {
            background: white;
            border-radius: 28px;
            padding: 1.5rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            border: 6px solid white;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .table-card:hover {
            transform: scale(1.03) rotate(-1deg);
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            margin: -1.5rem -1.5rem 1.5rem -1.5rem;
            padding: 1.2rem;
            border-radius: 22px 22px 0 0;
            color: #334155;
            border-bottom: 4px dashed rgba(255, 255, 255, 0.7);
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
            border-radius: 16px;
            background-color: #f8fafc;
            font-size: 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 3px solid transparent;
        }

        .row:hover {
            background-color: #fff;
            border-color: #cbd5e1;
            transform: translateX(8px);
        }

        .equation {
            color: #475569;
        }

        .result-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 45px;
            background-color: #e2e8f0;
            color: #94a3b8;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.6rem;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.05);
        }

        /* Cuando la respuesta se ha adivinado/revelado */
        .row.revealed {
            background-color: #f0fdf4;
            border-color: #86efac;
        }

        .row.revealed .result-box {
            background-color: #4ade80;
            color: white;
            transform: rotateY(360deg) scale(1.15);
            box-shadow: 0 5px 15px rgba(74, 222, 128, 0.4);
        }

        .row.revealed .equation {
            color: #15803d;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
            }

            70% {
                transform: scale(0.9);
            }

            100% {
                transform: scale(1);
            }
        }

        /* Asignar colores a cada tarjeta dinámicamente */
        .card-1 .card-header {
            background-color: var(--pastel-1);
        }

        .card-1 {
            border-color: var(--pastel-1);
        }

        .card-2 .card-header {
            background-color: var(--pastel-2);
        }

        .card-2 {
            border-color: var(--pastel-2);
        }

        .card-3 .card-header {
            background-color: var(--pastel-3);
        }

        .card-3 {
            border-color: var(--pastel-3);
        }

        .card-4 .card-header {
            background-color: var(--pastel-4);
        }

        .card-4 {
            border-color: var(--pastel-4);
        }

        .card-5 .card-header {
            background-color: var(--pastel-5);
        }

        .card-5 {
            border-color: var(--pastel-5);
        }

        .card-6 .card-header {
            background-color: var(--pastel-6);
        }

        .card-6 {
            border-color: var(--pastel-6);
        }

        .card-7 .card-header {
            background-color: var(--pastel-7);
        }

        .card-7 {
            border-color: var(--pastel-7);
        }

        .card-8 .card-header {
            background-color: var(--pastel-8);
        }

        .card-8 {
            border-color: var(--pastel-8);
        }

        .card-9 .card-header {
            background-color: var(--pastel-9);
        }

        .card-9 {
            border-color: var(--pastel-9);
        }

        .card-10 .card-header {
            background-color: var(--pastel-10);
        }

        .card-10 {
            border-color: var(--pastel-10);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 3rem;
            }

            .table-card {
                padding: 1.2rem;
                margin-bottom: 1rem;
                border-width: 4px;
            }

            .card-header {
                margin: -1.2rem -1.2rem 1rem -1.2rem;
                font-size: 1.8rem;
            }

            .tables-grid {
                gap: 1.5rem;
            }

            body {
                padding: 1rem;
            }

            .row {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>✨ Tablas Mágicas ✨</h1>
        <p>¡Adivina el resultado y haz clic en el '❓' para descubrirlo!</p>

        <div class="controls">
            <button class="btn-reset" onclick="ocultarTodas()">🔄 Ocultar todo para jugar otra vez</button>
        </div>
    </header>

    <div class="tables-grid" id="tables-container">
        <!-- Se generan por JavaScript -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('tables-container');

            for (let i = 1; i <= 10; i++) {
                const card = document.createElement('div');
                card.className = `table-card card-${i}`;

                const header = document.createElement('div');
                header.className = 'card-header';
                header.textContent = `Tabla del ${i}`;
                card.appendChild(header);

                for (let j = 1; j <= 10; j++) {
                    const row = document.createElement('div');
                    row.className = 'row';

                    // Almacenamos el resultado real en un data-attribute para revelarlo luego
                    row.dataset.result = i * j;

                    row.innerHTML = `
                        <span class="equation">${i} × ${j} =</span>
                        <div class="result-box">❓</div>
                    `;

                    // Evento click para revelar la respuesta y dar la sensación de juego
                    row.addEventListener('click', function () {
                        if (!this.classList.contains('revealed')) {
                            this.classList.add('revealed');
                            const box = this.querySelector('.result-box');
                            box.textContent = this.dataset.result;

                            // Animación de partículas o confeti podría ir aquí
                        }
                    });

                    card.appendChild(row);
                }

                container.appendChild(card);
            }
        });

        // Función para el botón de reiniciar el juego
        function ocultarTodas() {
            const rows = document.querySelectorAll('.row.revealed');
            rows.forEach(row => {
                row.classList.remove('revealed');
                const box = row.querySelector('.result-box');
                box.textContent = '❓';
            });
        }
    </script>
</body>

</html>
